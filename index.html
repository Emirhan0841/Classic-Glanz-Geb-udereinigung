<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classic Glanz – Professionelle Gebäudereinigung in Karlsruhe. Zuverlässige Reinigung für Büros, Gewerbe und Privathaushalte." />
    <meta name="theme-color" content="#102A43" />

    <title>Classic Glanz | Professionelle Gebäudereinigung Karlsruhe</title>

    <!-- Favicon -->
    <link rel="icon" href="/brand/favicon/favicon.ico" sizes="any">
    <link rel="icon" href="/brand/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/brand/favicon/site.webmanifest">

    <!-- Brand CSS mit Schriften und Tokens -->
    <link rel="stylesheet" href="/brand/brand.css">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Classic Glanz | Professionelle Gebäudereinigung">
    <meta property="og:description" content="Zuverlässige Reinigung für Büros, Gewerbe und Privathaushalte in Karlsruhe.">
    <meta property="og:image" content="https://classic-glanz.de/brand/social/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
  </head>
  <body>
    <!-- Statisches Formular für Netlify Forms Erkennung beim Deploy (wird nicht angezeigt) -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="checkbox" name="privacy" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
